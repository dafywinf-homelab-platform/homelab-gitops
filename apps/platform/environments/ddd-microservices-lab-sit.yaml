# platform -> environments -> ddd-microservices-lab-sit: the SIT environment of ddd-microservices-lab, defined in
# its own repo (ddd-microservices-lab-deploy: chart, values, MongoDB, Redpanda, and the child Applications).
#
# Synced automatically: it creates the child Applications (infra, order-service, inventory-service), which sync
# automatically too, so every release Renovate merges into ddd-microservices-lab-deploy is deployed.
# SIT needs ~1.75 GiB of memory requests (~1.3 GiB in use); until the RAM upgrade it runs while Jenkins is parked.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ddd-microservices-lab-sit
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dafywinf-homelab-platform/ddd-microservices-lab-deploy.git
    targetRevision: main
    path: argocd/sit
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
