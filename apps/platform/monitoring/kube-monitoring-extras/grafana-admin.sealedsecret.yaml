# SealedSecret for Secret kube-monitoring/grafana-admin (keys: admin-user admin-password). Safe to commit: only the sealed-secrets controller in the
# cluster can decrypt it. Re-create with scripts/seal-secret.sh (make seal); never edit the ciphertext.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-admin
  namespace: kube-monitoring
spec:
  encryptedData:
    admin-password: 
    admin-user: 
  template:
    metadata:
      name: grafana-admin
      namespace: kube-monitoring
