# platform -> secrets: app-of-apps for secret delivery (Sealed Secrets).
# Each file in apps/platform/secrets/ is one Application.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets
  namespace: argocd
  annotations:
    # Sync wave -4: first. The SealedSecret CRD and controller must exist before any app ships a SealedSecret
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: default
  source:
    repoURL: https://github.com/dafywinf-homelab-platform/homelab-gitops.git
    targetRevision: main
    path: apps/platform/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
