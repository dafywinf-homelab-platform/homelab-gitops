# Lets the Jenkins controller start and stop build pods in jenkins-docker: the same rules the chart gives it in
# jenkins-agents (Role jenkins-schedule-agents), which the chart can only create in one agent namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-schedule-agents
  namespace: jenkins-docker
rules:
  - apiGroups: [""]
    resources: [pods, pods/exec, pods/log, persistentvolumeclaims, events]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods, pods/exec, persistentvolumeclaims]
    verbs: [create, delete, deletecollection, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-schedule-agents
  namespace: jenkins-docker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-schedule-agents
subjects:
  - kind: ServiceAccount
    name: jenkins
    namespace: jenkins
