# SealedSecret for Secret jenkins/jenkins-admin (keys: jenkins-admin-user jenkins-admin-password). Safe to commit: only the sealed-secrets controller in the
# cluster can decrypt it. Re-create with scripts/seal-secret.sh (make seal); never edit the ciphertext.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: jenkins-admin
  namespace: jenkins
spec:
  encryptedData:
    jenkins-admin-password: 
    jenkins-admin-user: 
  template:
    metadata:
      name: jenkins-admin
      namespace: jenkins
