# platform -> ci -> jenkins: Jenkins LTS controller (no executors) that builds Java applications in throwaway agent pods
# (label `maven`: Maven 3.9 + Eclipse Temurin JDK 21) in the jenkins-agents namespace. UI at https://jenkins.192-168-86-10.sslip.io.
# The admin login comes from Secret jenkins/jenkins-admin, which the sealed-secrets controller creates from
# jenkins-extras/jenkins-admin.sealedsecret.yaml (re-seal with `make seal-jenkins-admin`).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.jenkins.io
      chart: jenkins
      targetRevision: 5.13.3
      helm:
        releaseName: jenkins
        valuesObject:
          controller:
            # Builds never run on the controller, only in agent pods
            numExecutors: 0
            # Helm test hooks are not run by Argo CD
            testEnabled: false
            jenkinsUrl: https://jenkins.192-168-86-10.sslip.io
            admin:
              createSecret: false
              existingSecret: jenkins-admin
            # Workers have ~4 GiB each when ballooned to their floor; keep the controller small
            resources:
              requests:
                cpu: 250m
                memory: 1Gi
              limits:
                cpu: "2"
                memory: 2Gi
            javaOpts: -XX:MaxRAMPercentage=60
            # Versions from the update centre for core 2.580.2 (chart defaults: kubernetes, workflow-aggregator, git,
            # configuration-as-code)
            additionalPlugins:
              - github-branch-source:1988.v87ea_66346560
              - junit:1458.1460.vd53b_087eeb_2c
              - pipeline-graph-view:1053.v9df19e6ceed2
              - timestamper:1.30
            ingress:
              enabled: true
              ingressClassName: traefik
              hostName: jenkins.192-168-86-10.sslip.io
              path: /
              pathType: Prefix
              annotations:
                traefik.ingress.kubernetes.io/router.entrypoints: websecure
              tls:
                - hosts:
                    - jenkins.192-168-86-10.sslip.io
          persistence:
            storageClass: longhorn
            size: 10Gi
          agent:
            # Build pods run in their own namespace, so a pipeline can't mount the controller's Secrets (anyone who can
            # create pods in a namespace can read its Secrets). The chart moves the pod-scheduling Role there too.
            namespace: jenkins-agents
            # At most two build pods at a time; the workers have little memory to spare
            containerCap: 2
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi
          additionalAgents:
            maven:
              podName: maven
              customJenkinsLabels:
                - maven
                - java
              additionalContainers:
                - sideContainerName: maven
                  image:
                    repository: maven
                    tag: 3.9.16-eclipse-temurin-21
                  command: sleep
                  args: infinity
                  resources:
                    requests:
                      cpu: 500m
                      memory: 1Gi
                    limits:
                      cpu: "2"
                      memory: 2Gi
            # Maven plus a Docker daemon, for Testcontainers tests. A new pod (and an empty Docker) per build. The dind
            # container is privileged, so these pods run in jenkins-docker (Pod Security privileged), not jenkins-agents
            maven-docker:
              podName: maven-docker
              namespace: jenkins-docker
              customJenkinsLabels:
                - maven-docker
              additionalContainers:
                - sideContainerName: maven
                  image:
                    repository: maven
                    tag: 3.9.16-eclipse-temurin-21
                  command: sleep
                  args: infinity
                  resources:
                    requests:
                      cpu: 500m
                      memory: 1Gi
                    limits:
                      cpu: "2"
                      memory: 2Gi
                # Test containers (Kafka, MongoDB, ...) run inside this container and count against its memory
                - sideContainerName: dind
                  image:
                    repository: docker
                    tag: 29.9.3-dind
                  # Empty: keep the image's entrypoint, which starts dockerd (the chart requires the key)
                  args: ""
                  privileged: true
                  resources:
                    requests:
                      cpu: 500m
                      memory: 1Gi
                    limits:
                      cpu: "2"
                      memory: 2560Mi
              envVars:
                # maven reaches the daemon over a socket in a shared emptyDir; dind's own entrypoint listens on the
                # same unix:// DOCKER_HOST. Its TCP port needs client certificates only dind has
                - name: DOCKER_HOST
                  value: unix:///var/run/dind/docker.sock
                # Docker 29 refuses API versions below 1.44 by default; Testcontainers before 1.21 asks for older ones
                - name: DOCKER_MIN_API_VERSION
                  value: "1.24"
                # The pod is deleted after the build, so Testcontainers' cleanup container (Ryuk) isn't needed
                - name: TESTCONTAINERS_RYUK_DISABLED
                  value: "true"
              volumes:
                - type: EmptyDir
                  mountPath: /var/run/dind
                # Images and containers: a volume per build on the workers' /mnt/data disk (local-path), deleted with
                # the pod. An emptyDir would fill the 30 GB root disk
                - type: EphemeralVolume
                  mountPath: /var/lib/docker
                  accessModes: ReadWriteOnce
                  requestsSize: 20Gi
                  storageClassName: local-path
    # Second source: the jenkins-agents and jenkins-docker Namespaces (build pods run there), the Role that lets Jenkins
    # start pods in jenkins-docker, and the admin SealedSecret
    - repoURL: https://github.com/dafywinf-homelab-platform/homelab-gitops.git
      targetRevision: main
      path: apps/platform/ci/jenkins-extras
  destination:
    server: https://kubernetes.default.svc
    namespace: jenkins
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
