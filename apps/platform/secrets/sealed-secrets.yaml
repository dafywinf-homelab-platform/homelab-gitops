# platform -> secrets -> sealed-secrets: decrypts SealedSecret resources committed to this repo into normal Secrets.
# Seal with `make seal` (see README). The private key is backed up outside Git (`make backup-sealing-key`).
# Design and rebuild procedure: homelab-architecture docs/09-secrets.md and ADR-010.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.22.0
    helm:
      releaseName: sealed-secrets
      valuesObject:
        # kubeseal's default controller name and namespace, so no --controller-name flags are needed
        fullnameOverride: sealed-secrets-controller
        # One key pair for good: no 30-day renewal, so a single backup of the private key restores every SealedSecret
        keyrenewperiod: "0"
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
