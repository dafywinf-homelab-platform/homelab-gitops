# platform -> monitoring: app-of-apps for everything observability-related.
# Each file in apps/platform/monitoring/ is one Application.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    # Sync wave 0: uses ingress (and could use storage); new groups default to wave 0 too
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/dafywinf-homelab-platform/homelab-gitops.git
    targetRevision: main
    path: apps/platform/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
